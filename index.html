<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Brand Restrictions</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --muted:#667085; --line:#e4e7ec;
          --red:#c62828; --redbg:#fdecea; --green:#1b7f3b; --greenbg:#e8f5ec; --accent:#2455d6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --card:#1a1e24; --ink:#e7eaee; --muted:#98a2b3; --line:#2b313a;
            --red:#ff6b6b; --redbg:#3a1d1d; --green:#5fd38a; --greenbg:#15301f; --accent:#6b93ff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:960px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:22px; margin:0 0 4px; } h2 { font-size:17px; margin:0 0 12px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row > * { flex:1 1 180px; }
  input, textarea, button { font:inherit; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); width:100%; }
  textarea { resize:vertical; min-height:60px; }
  button { background:var(--accent); color:#fff; border:none; cursor:pointer; font-weight:600; flex:0 0 auto; width:auto; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
  .result { margin-top:14px; padding:14px; border-radius:10px; font-weight:600; display:none; }
  .result.block { display:block; background:var(--redbg); color:var(--red); }
  .result.ok { display:block; background:var(--greenbg); color:var(--green); }
  .result ul { margin:6px 0 0; padding-left:18px; font-weight:400; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .tag { display:inline-block; padding:2px 8px; border-radius:999px; background:var(--redbg); color:var(--red); font-weight:600; font-size:13px; }
  .muted { color:var(--muted); font-size:13px; }
  .tablewrap { overflow-x:auto; }
  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  #msg { color:var(--red); margin-top:8px; min-height:1em; }
  .hidden { display:none; }
  a.link { color:var(--accent); cursor:pointer; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Client Brand Restrictions</h1>
      <p class="sub">Check before every order. If a brand is restricted for a client, do not order or list it.</p>
    </div>
    <button id="logoutBtn" class="ghost hidden">Sign out</button>
  </div>

  <!-- Login -->
  <div id="loginCard" class="card">
    <h2>Sign in</h2>
    <div class="row">
      <input id="email" type="email" placeholder="Email" autocomplete="username">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password">
      <button id="loginBtn">Sign in</button>
    </div>
    <div id="msg"></div>
  </div>

  <div id="app" class="hidden">
    <!-- Order check -->
    <div class="card">
      <h2>Order check</h2>
      <div class="row">
        <input id="chkClient" placeholder="Client name (e.g. Sylvia Gosline)">
        <input id="chkBrand" placeholder="Brand (optional, e.g. Monin)">
        <button id="chkBtn">Check</button>
      </div>
      <div id="chkResult" class="result"></div>
    </div>

    <!-- Add -->
    <div class="card">
      <h2>Add restriction</h2>
      <div class="row">
        <input id="addClient" placeholder="Client name *">
        <input id="addBrand" placeholder="Restricted brand *">
        <input id="addReason" placeholder="Reason * (e.g. C&D)">
      </div>
      <div class="row" style="margin-top:10px">
        <input id="addBy" placeholder="Reported by">
        <input id="addNotes" placeholder="Notes">
        <button id="addBtn">Save</button>
      </div>
      <div id="addMsg" class="muted" style="margin-top:8px"></div>
    </div>

    <!-- List -->
    <div class="card">
      <div class="top"><h2>All active restrictions</h2><input id="filter" placeholder="Search…" style="max-width:220px"></div>
      <div class="tablewrap">
        <table>
          <thead><tr><th>Client</th><th>Brand</th><th>Reason</th><th>Notes</th><th>Reported by</th><th>Added</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://yhpuknpadhysorhgijos.supabase.co";
const SUPABASE_KEY = "sb_publishable_euSGSCxJu-MHaQNaP6HysQ_kUn9Qj-d"; // publishable key (safe for browsers; data protected by RLS + login)
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const norm = s => (s || "").trim().toLowerCase().replace(/\s+/g, " ");
const esc = s => (s ?? "").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let all = [];

async function load() {
  const { data, error } = await sb.from("client_restrictions").select("*").eq("active", true).order("client_name");
  if (error) { alert(error.message); return; }
  all = data; render();
}
function render() {
  const f = norm($("filter").value);
  const list = all.filter(r => !f || norm(r.client_name + " " + r.restricted_brand + " " + r.reason).includes(f));
  $("rows").innerHTML = list.map(r => `<tr>
    <td><b>${esc(r.client_name)}</b></td><td><span class="tag">${esc(r.restricted_brand)}</span></td>
    <td>${esc(r.reason)}</td><td class="muted">${esc(r.notes)}</td><td class="muted">${esc(r.reported_by)}</td>
    <td class="muted">${new Date(r.created_at).toLocaleDateString()}</td>
    <td><a class="link" data-id="${r.id}">Remove</a></td></tr>`).join("") ||
    `<tr><td colspan="7" class="muted">No restrictions found.</td></tr>`;
}
function check() {
  const c = norm($("chkClient").value), b = norm($("chkBrand").value), box = $("chkResult");
  if (!c) { box.className = "result"; return; }
  const hits = all.filter(r => norm(r.client_name).includes(c) || c.includes(norm(r.client_name)));
  const brandHits = b ? hits.filter(r => norm(r.restricted_brand).includes(b) || b.includes(norm(r.restricted_brand))) : hits;
  if (brandHits.length) {
    box.className = "result block";
    box.innerHTML = `⛔ DO NOT ORDER${b ? "" : " these brands"}:<ul>` +
      brandHits.map(r => `<li><b>${esc(r.restricted_brand)}</b> for ${esc(r.client_name)} — ${esc(r.reason)}</li>`).join("") + "</ul>";
  } else {
    box.className = "result ok";
    box.textContent = b ? `✅ No restriction on ${$("chkBrand").value} for this client.` : "✅ No restrictions on file for this client.";
  }
}
async function add() {
  const row = { client_name: $("addClient").value.trim(), restricted_brand: $("addBrand").value.trim(),
    reason: $("addReason").value.trim(), reported_by: $("addBy").value.trim() || null, notes: $("addNotes").value.trim() || null };
  if (!row.client_name || !row.restricted_brand || !row.reason) { $("addMsg").textContent = "Client, brand and reason are required."; return; }
  const { error } = await sb.from("client_restrictions").insert(row);
  if (error) { $("addMsg").textContent = error.message; return; }
  ["addClient","addBrand","addReason","addBy","addNotes"].forEach(i => $(i).value = "");
  $("addMsg").textContent = "Saved."; load();
}
async function removeRow(id) {
  if (!confirm("Remove this restriction?")) return;
  const { error } = await sb.from("client_restrictions").update({ active: false }).eq("id", id);
  if (error) alert(error.message); else load();
}
async function showApp(session) {
  $("loginCard").classList.toggle("hidden", !!session);
  $("app").classList.toggle("hidden", !session);
  $("logoutBtn").classList.toggle("hidden", !session);
  if (session) load();
}
$("loginBtn").onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value, password: $("password").value });
  $("msg").textContent = error ? error.message : "";
};
$("password").onkeydown = e => { if (e.key === "Enter") $("loginBtn").click(); };
$("logoutBtn").onclick = () => sb.auth.signOut();
$("chkBtn").onclick = check;
$("chkClient").oninput = check; $("chkBrand").oninput = check;
$("addBtn").onclick = add;
$("filter").oninput = render;
$("rows").onclick = e => { const id = e.target.dataset.id; if (id) removeRow(id); };
sb.auth.onAuthStateChange((_e, session) => showApp(session));
sb.auth.getSession().then(({ data }) => showApp(data.session));
</script>
</body>
</html>
